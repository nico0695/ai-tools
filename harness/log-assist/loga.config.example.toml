# Example of loga.config.toml.
# loga-init writes the real file in the clone root; it is gitignored.
# Copy this file only to inspect the shape — do not hand-edit the generated one
# unless you rerun loga-init afterwards.

# Harness version this config was written for. loga_doctor compares it against
# the repo to detect a stale clone.
version = "0.1"

# Language of the chat and of the prose inside SUMMARY.md, record/*.md and
# reports/*.md. Section headings, TOML keys, file names, ids (F-01, H-01) and
# status values stay in English regardless of this setting, and log excerpts are
# always verbatim.
language = "es"                  # es | en

# Command that runs Python >= 3.11, detected by loga-init.
python_cmd = "python3"           # python3 | python | py -3

# Date of the last successful loga-init validation run.
validated_at = "2026-09-13"

# AI setups checked statically by loga-init: CLI on PATH, adapter present and
# parseable, wrapper present, skill copies in sync. No tokens are spent.
[ai_setups.claude]
enabled = true
cli = "claude"
status = "ok"                    # ok | partial | missing
checked = "2026-09-13"

[ai_setups.codex]
enabled = true
cli = "codex"
status = "ok"
checked = "2026-09-13"
